events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # 量化选股面板
    server {
        listen 80;
        server_name lhz456.xyz;

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 后续项目预留
    # server {
    #     listen 80;
    #     server_name lhz456.xyz;
    #     location /review { proxy_pass http://review:8001; }
    #     location /words  { proxy_pass http://words:8002;  }
    # }
}
